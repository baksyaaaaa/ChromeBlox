name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "mods/**"          # mod changes sync straight from the repo, no rebuild needed
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp build number
        run: Set-Content -Path src/build_info.py -Value "BUILD = ${{ github.run_number }}"

      # folder build (not one-file) so it opens fast: the sign-in browser is big
      - name: Build
        run: pyinstaller --noconfirm --onedir --windowed --name ChromeBlox --icon icon.ico --paths src src/main.py

      - name: Zip
        run: Compress-Archive -Path dist/ChromeBlox -DestinationPath ChromeBlox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChromeBlox
          path: dist/ChromeBlox

      # every build becomes a release, so the launcher can update itself
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chrome Blox build ${{ github.run_number }}
          make_latest: true
          files: ChromeBlox.zip
