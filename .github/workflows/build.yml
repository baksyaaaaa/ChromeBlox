name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name ChromeBlox --paths src src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ChromeBlox
          path: dist/ChromeBlox.exe

      - name: Publish release (when you push a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChromeBlox.exe
