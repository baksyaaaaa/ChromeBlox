name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      # folder build (not one-file) so it opens fast: the sign-in browser is big
      - name: Build
        run: pyinstaller --noconfirm --onedir --windowed --name ChromeBlox --icon icon.ico --paths src src/main.py

      - name: Zip
        run: Compress-Archive -Path dist/ChromeBlox -DestinationPath ChromeBlox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChromeBlox
          path: dist/ChromeBlox

      - name: Publish release (when you push a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChromeBlox.zip
